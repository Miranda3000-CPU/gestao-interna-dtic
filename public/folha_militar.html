<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Serviço Extraordinário</title>
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/holidays.js"></script>
    <style>
        @media print {
            @page { 
                size: A4; 
                margin: 10mm; 
            }
            body { 
                margin: 0; 
                padding: 0; 
                -webkit-print-color-adjust: exact; 
                print-color-adjust: exact; 
            }
            .no-print { display: none; }
            .page-break { page-break-after: always; }
        }

        body {
            font-family: Arial, sans-serif;
            font-size: 11px;
            color: #000;
        }

        .container { 
            width: 100%; 
            max-width: 210mm; 
            margin: 0 auto; 
            position: relative;
        }

        .center { text-align: center; }
        .bold { font-weight: bold; }

        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-bottom: 5px; 
            font-size: 10px;
        }
        td, th { 
            border: 1px solid black; 
            padding: 2px 3px;
            vertical-align: middle; 
        }

        .header-box { text-align: center; margin-bottom: 10px; }
        .header-logo { height: 65px; margin-bottom: 5px; }
        .header-text { font-size: 12px; font-weight: bold; text-transform: uppercase; line-height: 1.2; }

        .title-box {
            border-top: 2px solid black;
            border-bottom: 2px solid black;
            text-align: center;
            font-weight: bold;
            font-size: 11px;
            padding: 5px 0;
            margin-bottom: 10px;
        }

        .info-section { font-size: 11px; font-weight: bold; margin-bottom: 5px; }

        th { background-color: #d9d9d9; }
        td { height: 14px; }

        .col-dia { width: 35px; text-align: center; background-color: #e0e0e0; font-weight: bold; }
        .col-ass { text-align: center; }
        .col-hora { width: 80px; text-align: center; }
        .col-visto { width: 180px; }
        
        .weekend-text { font-weight: bold; letter-spacing: 1px; }
        
        .total-row {
            background-color: #d9d9d9;
            font-weight: bold;
            text-align: right;
            padding-right: 10px;
        }

        .footer-block {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: 20px;
            padding-bottom: 10px;
        }
        
        .footer-left {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 9px;
            line-height: 1.3;
        }
        .footer-logo { height: 50px; }
        
        .footer-right {
            text-align: center;
            width: 250px;
            border: 1px solid black;
            height: 90px;
            position: relative;
        }
        
        .signature-text {
            position: absolute;
            bottom: 5px;
            width: 100%;
            font-size: 10px;
        }
    </style>
</head>
<body>
    <div class="no-print" style="position: fixed; top: 0; left: 0; width: 100%; background: #333; color: white; padding: 10px; text-align: center; z-index: 9999;">
        <button onclick="window.print()" style="background: #4CAF50; color: white; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; font-size: 14px;">🖨️ IMPRIMIR / SALVAR PDF</button>
    </div>
    <div style="height: 50px;" class="no-print"></div>

    <div id="content"></div>

    <script src="js/militar-report.js"></script>
</body>
</html>
